<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigil Log Triage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%236ea8fe'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d1014;
    --panel: #151a20;
    --panel-2: #1b2129;
    --line: #262e38;
    --text: #e6e9ee;
    --muted: #8b95a3;
    --accent: #6ea8fe;
    --critical: #ff6b6b;
    --high: #ffa94d;
    --low: #8b95a3;
    --ok: #51cf66;
    --warn: #fcc419;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .stack > * + * { margin-top: 20px; }

  /* Input */
  .input-row { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 14px; align-items: end; }
  label.field { display: block; font-size: 13px; color: var(--muted); }
  select, .file {
    display: block; width: 100%; margin-top: 6px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit;
  }
  .file { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-style: dashed; }
  .file.has-file { border-style: solid; border-color: var(--accent); }
  .file.drag { border-color: var(--accent); background: #1a2433; }
  .or { color: var(--muted); padding-bottom: 10px; font-size: 13px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 11px 22px; cursor: pointer;
    background: var(--accent); color: #0b1220;
  }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  input[type=file] { display: none; }

  .status { display: none; align-items: center; gap: 12px; margin-top: 14px; color: var(--muted); }
  .status.on { display: flex; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { border-color: #5c2b2b; background: #221516; color: #ffc9c9; }

  /* Summary */
  .summary-text { font-size: 16px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .chip strong { color: var(--text); font-weight: 600; }

  /* Rankings */
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .rank-list { list-style: none; margin: 0; padding: 0; }
  .rank-list li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .rank-list li:first-child { border-top: 0; }
  .pos { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .rank-main { min-width: 0; }
  .rank-title { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .gid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .svc { font-weight: 600; }
  .sig { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reason { font-size: 13px; color: #c9d1db; margin-top: 4px; }
  .count { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  .lvl { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .lvl-CRITICAL { background: #3b1a1d; color: var(--critical); }
  .lvl-ERROR { background: #3a2716; color: var(--high); }
  .lvl-WARNING { background: #2a2a1a; color: var(--warn); }
  .move { font-size: 12px; font-weight: 700; white-space: nowrap; }
  .move.up { color: var(--ok); }
  .move.down { color: var(--high); }
  .move.same { color: var(--muted); font-weight: 400; }
  li.root { background: linear-gradient(90deg, rgba(255,107,107,0.08), transparent 70%); }

  /* Findings */
  .findings { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .card.sev-critical { border-left: 3px solid var(--critical); }
  .card.sev-high { border-left: 3px solid var(--high); }
  .card.sev-low { border-left: 3px solid var(--low); }
  .card h3 { margin: 8px 0 4px; font-size: 16px; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
  .badge.critical { background: #3b1a1d; color: var(--critical); }
  .badge.high { background: #3a2716; color: var(--high); }
  .badge.low { background: #22272e; color: var(--low); }
  .badge.verified { background: #17301f; color: var(--ok); }
  .badge.unverified { background: #332b10; color: var(--warn); }
  .badge.review { background: #2b2140; color: #c9a7ff; }
  .badge.root { background: #3b1a1d; color: #ffc9c9; }
  dl { margin: 12px 0 0; }
  dt { font-size: 12px; color: var(--muted); margin-top: 10px; }
  dd { margin: 2px 0 0; }
  .conf { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .bar { flex: 1; height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  pre.evidence {
    font-family: var(--mono); font-size: 12px; line-height: 1.55; background: #0a0d11; border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; margin: 12px 0 0; overflow-x: auto; white-space: pre;
  }
  .ln { color: var(--muted); user-select: none; }
  .bad-line { color: var(--warn); }
  .problems { font-size: 12px; color: var(--warn); margin: 8px 0 0; padding-left: 18px; }

  /* Metrics + footer */
  .metrics { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; }
  .metric { font-size: 13px; color: var(--muted); }
  .metric strong { display: block; font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
  .metrics .spacer { flex: 1; }
  .warnings { font-size: 12px; color: var(--muted); margin: 10px 0 0; padding-left: 18px; }
  footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }

  @media (max-width: 820px) {
    .input-row { grid-template-columns: 1fr; }
    .or { padding: 0; text-align: center; }
    .columns { grid-template-columns: 1fr; }
    .findings { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="stack">
  <header>
    <h1>vigil<span>.</span></h1>
    <p>Groups log errors, re-ranks root cause vs symptom, cites the lines it relies on.</p>
  </header>

  <section class="panel" aria-label="Choose a log">
    <div class="input-row">
      <label class="field">Sample log
        <select id="sample"><option value="">Loading samples...</option></select>
      </label>
      <div class="or">or</div>
      <label class="field">Upload (.log / .txt, max 2 MB)
        <span class="file" id="drop" tabindex="0">Choose or drop a file</span>
        <input type="file" id="file" accept=".log,.txt,text/plain">
      </label>
      <button id="analyze" type="button">Analyze</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">
      <div class="spinner"></div><span id="status-text">Analyzing...</span>
    </div>
  </section>

  <section class="panel error hidden" id="error" role="alert"></section>

  <div id="results" class="stack hidden">
    <section class="panel" id="summary-panel">
      <h2>Summary</h2>
      <p class="summary-text" id="summary"></p>
      <div class="chips" id="chips"></div>
    </section>

    <section class="columns">
      <div class="panel">
        <h2>Baseline rank</h2>
        <ol class="rank-list" id="baseline"></ol>
      </div>
      <div class="panel" id="vigil-panel">
        <h2>Vigil rank</h2>
        <ol class="rank-list" id="vigil"></ol>
      </div>
    </section>

    <section id="findings-section">
      <h2>Findings</h2>
      <div class="findings" id="findings"></div>
    </section>

    <section class="panel">
      <div class="metrics" id="metrics"></div>
      <ul class="warnings" id="warnings"></ul>
    </section>
  </div>

  <footer>Demo uses synthetic logs. Vigil only reads and suggests.</footer>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const MAX_BYTES = 2 * 1024 * 1024;
  let chosenFile = null;
  let lastResult = null;

  // Build DOM with textContent only: log lines are untrusted input.
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    }
    for (const child of children.flat()) {
      if (child == null || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  async function loadSamples() {
    const select = $("sample");
    try {
      const res = await fetch("/api/samples");
      const samples = await res.json();
      select.replaceChildren(el("option", { value: "", text: "Pick a sample..." }));
      for (const s of samples) {
        select.append(el("option", { value: s.name, text: `${s.name} (${s.lines} lines)` }));
      }
      const demo = samples.find((s) => s.name === "payments_incident.log");
      if (demo) select.value = demo.name;
    } catch {
      select.replaceChildren(el("option", { value: "", text: "Could not load samples" }));
    }
  }

  function setFile(file) {
    const drop = $("drop");
    showError(null);
    if (!file) return;
    if (!/\.(log|txt)$/i.test(file.name)) return showError("Only .log and .txt files are accepted.");
    if (file.size > MAX_BYTES) return showError("File is larger than 2 MB.");
    chosenFile = file;
    drop.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    drop.classList.add("has-file");
    $("sample").value = "";
  }

  function clearFile() {
    chosenFile = null;
    $("file").value = "";
    $("drop").textContent = "Choose or drop a file";
    $("drop").classList.remove("has-file");
  }

  function showError(message) {
    const box = $("error");
    box.textContent = message || "";
    box.classList.toggle("hidden", !message);
  }

  function setLoading(on) {
    $("analyze").disabled = on;
    $("status").classList.toggle("on", on);
    if (!on) return;
    const started = Date.now();
    const tick = () => {
      if (!$("analyze").disabled) return;
      const s = Math.round((Date.now() - started) / 1000);
      $("status-text").textContent = `Parsing, grouping and asking the model... ${s}s`;
      setTimeout(tick, 500);
    };
    tick();
  }

  async function analyze() {
    const sample = $("sample").value;
    if (!chosenFile && !sample) return showError("Pick a sample log or upload a file first.");
    const form = new FormData();
    if (chosenFile) form.append("file", chosenFile);
    else form.append("sample", sample);

    showError(null);
    setLoading(true);
    try {
      const res = await fetch("/api/analyze", { method: "POST", body: form });
      let data;
      try { data = await res.json(); } catch { data = { status: "error", error: `Server returned ${res.status}.` }; }
      if (data.baseline) render(data);
      if (data.status !== "ok") showError(data.error || `Request failed (${res.status}).`);
    } catch {
      showError("Could not reach the server.");
    } finally {
      setLoading(false);
    }
  }

  function levelTag(level) {
    return el("span", { class: `lvl lvl-${level}`, text: level });
  }

  function moveTag(delta) {
    if (delta > 0) return el("span", { class: "move up", title: `moved up ${delta}`, text: `↑ ${delta}` });
    if (delta < 0) return el("span", { class: "move down", title: `moved down ${-delta}`, text: `↓ ${-delta}` });
    return el("span", { class: "move same", text: "–" });
  }

  function rankItem(position, group, extra, isRoot) {
    return el("li", { class: isRoot ? "root" : "" },
      el("span", { class: "pos", text: position }),
      el("div", { class: "rank-main" },
        el("div", { class: "rank-title" },
          el("span", { class: "gid", text: group.id }),
          el("span", { class: "svc", text: group.service }),
          levelTag(group.level),
          isRoot ? el("span", { class: "badge root", text: "root cause" }) : null),
        el("div", { class: "sig", title: group.signature, text: group.signature }),
        extra.reason ? el("div", { class: "reason", text: extra.reason }) : null),
      el("div", { class: "count" },
        extra.move || null,
        el("div", { text: `×${group.count}` }),
        extra.score != null ? el("div", { text: `score ${extra.score}` }) : null));
  }

  function render(r) {
    lastResult = r;
    const groups = Object.fromEntries(r.baseline.map((g) => [g.id, g]));
    const root = r.root_cause_group_id;
    $("results").classList.remove("hidden");

    const s = r.log_summary;
    $("summary").textContent = r.summary || (r.status === "ok" ? "" : "The model step failed; showing the deterministic baseline only.");
    $("chips").replaceChildren(
      chip("Log", r.source),
      chip("Range", `${s.first_timestamp || "?"} → ${s.last_timestamp || "?"}`),
      chip("Parsed", `${s.parsed_lines} lines`),
      chip("Unparsed", s.unparsed_lines),
      chip("Groups", r.baseline.length),
      root && groups[root] ? chip("Root cause", `${root} · ${groups[root].service}`) : null);

    $("baseline").replaceChildren(...r.baseline.map((g) =>
      rankItem(g.base_position, g, { score: g.score }, false)));

    const hasVigil = r.vigil_ranking && r.vigil_ranking.length > 0;
    $("vigil-panel").classList.toggle("hidden", !hasVigil);
    if (hasVigil) {
      $("vigil").replaceChildren(...r.vigil_ranking.map((row) =>
        rankItem(row.position, groups[row.id], { move: moveTag(row.delta), reason: row.reason }, row.id === root)));
    }

    $("findings-section").classList.toggle("hidden", !(r.findings && r.findings.length));
    $("findings").replaceChildren(...(r.findings || []).map((f) => findingCard(f, groups[f.group_id], f.group_id === root)));

    renderMetrics(r);
    $("warnings").replaceChildren(...(r.warnings || []).map((w) => el("li", { text: w })));
    $("results").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function chip(label, value) {
    return el("span", { class: "chip" }, `${label} `, el("strong", { text: value }));
  }

  function findingCard(f, group, isRoot) {
    const evidence = el("pre", { class: "evidence" });
    for (const ev of f.evidence) {
      const line = el("div", { class: ev.matches_group ? "" : "bad-line" },
        el("span", { class: "ln", text: String(ev.line_no).padStart(5, " ") + "  " }),
        ev.text != null ? ev.text : "<no such line>");
      evidence.append(line);
    }
    const pct = Math.round(f.confidence * 100);
    return el("article", { class: `card sev-${f.severity}` },
      el("div", { class: "badges" },
        el("span", { class: `badge ${f.severity}`, text: f.severity }),
        el("span", { class: `badge ${f.verification}`, text: f.verification }),
        f.needs_human_review ? el("span", { class: "badge review", text: "Needs human review" }) : null,
        isRoot ? el("span", { class: "badge root", text: "root cause" }) : null),
      el("h3", { text: f.title }),
      el("div", { class: "meta", text: group
        ? `${f.group_id} · ${group.service} · ×${group.count} · ${group.first_seen} → ${group.last_seen}`
        : f.group_id }),
      el("dl", {},
        el("dt", { text: "Why this severity" }), el("dd", { text: f.justification }),
        el("dt", { text: "Likely cause" }), el("dd", { text: f.likely_cause }),
        el("dt", { text: "Suggested fix" }), el("dd", { text: f.suggested_fix })),
      el("div", { class: "conf" },
        el("span", { text: `confidence ${pct}%` }),
        el("div", { class: "bar" }, el("div", { style: `width:${pct}%` }))),
      evidence,
      f.problems && f.problems.length
        ? el("ul", { class: "problems" }, f.problems.map((p) => el("li", { text: p })))
        : null);
  }

  function renderMetrics(r) {
    const m = r.metrics;
    const metric = (label, value) => el("div", { class: "metric" }, el("strong", { text: value }), label);
    const download = el("button", { class: "secondary", type: "button", text: "Download report (.md)" });
    download.addEventListener("click", downloadReport);
    $("metrics").replaceChildren(
      metric("latency", m.latency_ms >= 1000 ? `${(m.latency_ms / 1000).toFixed(1)} s` : `${m.latency_ms} ms`),
      metric("LLM calls", m.llm_calls),
      metric("tool calls", m.tool_calls),
      metric("tokens (in / out)", `${m.tokens.prompt.toLocaleString()} / ${m.tokens.output.toLocaleString()}`),
      metric("total tokens", m.tokens.total.toLocaleString()),
      metric("attempts", m.attempts),
      m.model ? metric("model", m.model) : null,
      el("div", { class: "spacer" }),
      download);
  }

  function downloadReport() {
    if (!lastResult) return;
    const blob = new Blob([lastResult.report_markdown], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const base = (lastResult.source || "log").replace(/\.[^.]+$/, "");
    const a = el("a", { href: url, download: `vigil-report-${base}.md` });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Wiring
  const drop = $("drop");
  drop.addEventListener("click", () => $("file").click());
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
  $("file").addEventListener("change", (e) => setFile(e.target.files[0]));
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("drag"); }));
  drop.addEventListener("drop", (e) => setFile(e.dataTransfer.files[0]));
  $("sample").addEventListener("change", () => { if ($("sample").value) clearFile(); });
  $("analyze").addEventListener("click", analyze);
  loadSamples();
})();
</script>
</body>
</html>
